[project]
name = "fusion-common"
version = "0.6.6"
description = "Общее ядро термометрии, калибровок, форматов файлов и сплэш-экрана для пакетов Fusion"
authors = [{ name = "Ilya O. Yurev", email = "i.o.yurev@yandex.ru" }]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.2.0",
    "pydantic>=2.11.0",
    "pyside6>=6.9.0",
]

[project.scripts]
fusion-splash = "fusion_common.splash:main_cli"
fusion-packaging = "fusion_common.packaging:main_packaging_cli"
fusion-docs = "fusion_common.docs_viewer:main_docs_cli"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "pytest>=9.0.0",
    "ruff>=0.11.0",
    "vulture>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fusion_common"]

[tool.vulture]
min_confidence = 60
paths = ["fusion_common", "tests", "vulture_whitelist.py"]
