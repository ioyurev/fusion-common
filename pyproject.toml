[project]
name = "fusion-common"
version = "0.2.0"
description = "Общее ядро термометрии, калибровок и форматов файлов для пакетов термического анализа Fusion"
authors = [{ name = "Ilya O. Yurev", email = "i.o.yurev@yandex.ru" }]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=1.26.2",
    "pandas>=2.1.3",
    "pydantic>=2.11.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pandas-stubs>=2.1.1",
    "pre-commit>=4.2.0",
    "pytest>=9.0.0",
    "ruff>=0.11.0",
    "vulture>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fusion_common"]

[tool.vulture]
min_confidence = 60
paths = ["fusion_common", "tests", "vulture_whitelist.py"]
