[project]
name = "fusion-common"
version = "0.7.4"
description = "Общее ядро термометрии, калибровок, форматов файлов и сплэш-экрана для пакетов Fusion"
authors = [{ name = "Ilya O. Yurev", email = "i.o.yurev@yandex.ru" }]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.2.0",
    "pydantic>=2.11.0",
    "pyside6>=6.9.0",
]

[project.scripts]
fusion-splash = "fusion_common.splash:main_cli"
fusion-packaging = "fusion_common.packaging:main_packaging_cli"
fusion-docs = "fusion_common.docs_viewer:main_docs_cli"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "pytest>=9.0.0",
    "ruff>=0.11.0",
    "vulture>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fusion_common"]

[tool.vulture]
min_confidence = 60
paths = ["fusion_common", "tests", "vulture_whitelist.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # any-type: разрешает typing.Any для полиморфных обёрток Qt/PyQtGraph, JSON-метаданных и loguru.Record
    "C901",    # complex-structure: диалоги, парсеры и сборщики UI имеют естественное ветвление по элементам
    "COM812",  # missing-trailing-comma: конфликтует с правилами расстановки запятых форматтера ruff-format
    "CPY001",  # missing-copyright-notice: лицензия GPLv3 оформлена централизованно в LICENSE.md и LICENSE.ru.md
    "D100",    # undocumented-public-module: избыточный docstring на уровне очевидных модулей и тестов
    "D101",    # undocumented-public-class: избыточный docstring для стандартных виджетов и моделей
    "D102",    # undocumented-public-method: избыточный docstring для стандартных слотов и обработчиков Qt
    "D103",    # undocumented-public-function: избыточный docstring для очевидных вспомогательных и тестовых функций
    "D104",    # undocumented-public-package: __init__.py содержит только реэкспорт и метаданные версии
    "D105",    # undocumented-magic-method: стандартные магические методы (__str__ и др.) не требуют docstring
    "D107",    # undocumented-public-init: параметры конструкторов задокументированы строгими аннотациями типов
    "D203",    # incorrect-blank-line-before-class: взаимоисключающе конфликтует с правилом D211
    "D213",    # multi-line-summary-second-line: взаимоисключающе конфликтует с правилом D212
    "E501",    # line-too-long: длинные кириллические строки интерфейса и диагностических сообщений не переносятся принудительно
    "EM101",   # raw-string-in-exception: кириллические сообщения об ошибках читаемее прямо в конструкторе raise
    "EM102",   # f-string-in-exception: f-строки с контекстом ошибки удобнее формировать прямо в raise без лишних переменных
    "FBT001",  # boolean-type-hint-positional-argument: слоты и методы Qt требуют позиционных bool-параметров
    "FBT002",  # boolean-default-value-positional-argument: совместимость с существующими флагами по умолчанию (is_err=False и др.)
    "FBT003",  # boolean-positional-value-in-call: стандартные вызовы API Qt принимают позиционные bool (setVisible, setEnabled)
    "N802",    # invalid-function-name: переопределения виртуальных методов Qt используют camelCase (closeEvent и др.)
    "N803",    # invalid-argument-name: совместимость с унаследованными именами параметров
    "N815",    # mixed-case-variable-in-class-scope: совместимость с историческими именами полей моделей и настроек
    "PLC0415", # import-outside-top-level: ленивые импорты после показа сплэш-экрана (pyi_splash) и платформные импорты
    "PLR0911", # too-many-return-statements: парсеры и валидаторы используют ранние возвраты (guard clauses)
    "PLR0912", # too-many-branches: линейная диспетчеризация вариантов форматов и UI-событий
    "PLR0913", # too-many-arguments: диалоги, модели и функции генерации принимают полный набор именованных параметров
    "PLR0915", # too-many-statements: методы компоновки диалогов и генерации конфигов собирают интерфейс в одном блоке
    "PLR0917", # too-many-positional-arguments: совместимость с унаследованными сигнатурами и вызовами Qt
    "PLR2004", # magic-value-comparison: физические пороги, пределы шкал и размеры окна естественны по месту проверки
    "PLW0108", # unnecessary-lambda: в Qt-подключениях clicked.connect(lambda: ...) фиксируются аргументы и отложенный вызов
    "RUF001",  # ambiguous-unicode-character-string: ложное срабатывание на кириллицу в строках рядом с латиницей и единицами
    "RUF002",  # ambiguous-unicode-character-docstring: ложное срабатывание на русскоязычные docstrings
    "RUF003",  # ambiguous-unicode-character-comment: ложное срабатывание на русскоязычные комментарии
    "RUF102",  # invalid-noqa: ложно принимает директивы проектных AST-чекеров (# noqa: PU001, # noqa: MI001) за невалидные
    "S603",    # subprocess-without-shell-equals-true: осознанный запуск штатных CLI-утилит (pandoc, iscc) без shell=True
    "S607",    # start-process-with-partial-path: системные CLI-утилиты разрешаются через PATH / shutil.which
    "TRY003",  # raise-vanilla-args: подробные русскоязычные сообщения об ошибках передаются напрямую в стандартные исключения
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "INP001", # implicit-namespace-package: каталог тестов tests/ не является импортируемым пакетом и не требует __init__.py
    "S101",   # assert: штатный оператор утверждений в тестах pytest
    "SLF001", # private-member-access: тесты могут проверять внутреннее состояние и вспомогательные функции модулей
]
"vulture_whitelist.py" = [
    "INP001", # implicit-namespace-package: корневой файл белого списка vulture не является пакетом и не требует __init__.py
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
